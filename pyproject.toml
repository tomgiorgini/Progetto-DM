[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-data-warehouse"
version = "1.0.0"
description = "ETL and dimensional warehouse for UFC fight analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ufc-etl = "ufc_dw.etl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
